name: SonarCloud Analysis

on:
  push:
    branches:
      - lab1
  pull_request:
    branches:
      - lab1

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build and analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Write token to a temporary file
          $tokenFile = "sonar-token.txt"
          $env:SONAR_TOKEN | Out-File -FilePath $tokenFile -Encoding ascii
          
          # Start analysis using the token file
          dotnet sonarscanner begin `
            /k:"j-mirana_NetSdrClient_labs" `
            /o:"j-mirana" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$(Get-Content $tokenFile)"
          
          # Build solution
          dotnet build NetSdrClient.sln --no-incremental
          
          # End analysis using the token file
          dotnet sonarscanner end `
            /d:sonar.token="$(Get-Content $tokenFile)"
          
          # Clean up
          Remove-Item $tokenFile -Force