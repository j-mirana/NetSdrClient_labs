name: SonarQube
on:
  # 1. Тригер на push у гілку 'lab1'
  push:
    branches:
      - lab1
  
  # 2. Тригер на pull_request, що таргетує гілку 'lab1'
  pull_request:
    branches:
      - lab1
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    
    # Визначаємо токен для використання в Powershell
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
    permissions:
      pull-requests: write 
      contents: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      # 1. CLEAN UP (Видалення конфліктуючого файлу)
      - name: Clean up sonar-project.properties
        run: |
          Remove-Item -Path ".\sonar-project.properties" -Force -ErrorAction SilentlyContinue
        shell: pwsh
        
      # 2. Установка .NET Sonar Scanner (використовуємо глобальну установку)
      - name: Install Sonar Scanner
        run: dotnet tool install --global dotnet-sonarscanner
        shell: pwsh
      
      # 3. ФІНАЛЬНА ЗБІРКА ТА АНАЛІЗ (ОБ'ЄДНАНО В ОДИН RUN-БЛОК ДЛЯ СТАБІЛЬНОСТІ)
      # Цей крок замінює всі попередні кроки 3, 4, 5
      - name: SonarScanner Analysis, Build, Test, and End
        shell: pwsh
        run: |
          # Встановлюємо шлях до сканера
          $scannerPath = "$env:USERPROFILE\.dotnet\tools\dotnet-sonarscanner"
          
          # 3.1 BEGIN STEP
          & $scannerPath begin `
            /k:"j-mirana_NetSdrClient_labs" `
            /o:"j-mirana" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.xml" `
            /d:sonar.login="$env:SONAR_TOKEN" 
          
          # 3.2 BUILD STEP (Використовуємо Release для Coverlet)
          dotnet build NetSdrClient.sln -c Release
          
          # 3.3 TEST & COVERAGE STEP (Вже без --no-build, як було виправлено)
          dotnet test NetSdrClientAppTests/NetSdrClientAppTests.csproj -c Release `
            /p:CollectCoverage=true `
            /p:CoverletOutput=TestResults/coverage.xml `
            /p:CoverletOutputFormat=opencover
          
          # 3.4 END STEP
          & $scannerPath end /d:sonar.login="$env:SONAR_TOKEN"