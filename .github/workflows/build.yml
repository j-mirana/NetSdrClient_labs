name: SonarQube
on:
  # 1. Тригер на push у гілку 'lab1'
  push:
    branches:
      - lab1
  
  # 2. Тригер на pull_request, що таргетує гілку 'lab1'
  pull_request:
    branches:
      - lab1
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    
    # Визначаємо токен для використання в Powershell
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
    permissions:
      pull-requests: write 
      contents: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      # 1. CLEAN UP (Видалення конфліктуючого файлу)
      - name: Clean up sonar-project.properties
        run: |
          Remove-Item -Path ".\sonar-project.properties" -Force -ErrorAction SilentlyContinue
        shell: pwsh
        
      # 2. Установка та виконання .NET Sonar Scanner
      - name: Install Sonar Scanner
        run: dotnet tool install --global dotnet-sonarscanner
        shell: pwsh
      
      # 3. SONARSCANNER BEGIN & BUILD (ВИПРАВЛЕНО!)
      - name: SonarScanner Begin & Build
        shell: pwsh
        run: |
          $scannerPath = "$env:USERPROFILE\.dotnet\tools\dotnet-sonarscanner"
          
          # BEGIN STEP
          & $scannerPath begin `
            /k:"j-mirana_NetSdrClient_labs" `
            /o:"j-mirana" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.xml" `
            /d:sonar.login="$env:SONAR_TOKEN" 
          
          # BUILD STEP (Залишаємо тільки Build, Test буде окремо)
          dotnet build NetSdrClient.sln
          
      # 4. ТЕСТУВАННЯ ТА ПОКРИТТЯ (КРИТИЧНЕ ВИПРАВЛЕННЯ: ПРИБРАНО --no-build)
      - name: Tests with coverage (OpenCover)
        shell: pwsh
        run: dotnet test NetSdrClientAppTests/NetSdrClientAppTests.csproj -c Release `
          /p:CollectCoverage=true `
          /p:CoverletOutput=TestResults/coverage.xml `
          /p:CoverletOutputFormat=opencover
          
      # 5. SONARSCANNER END
      - name: SonarScanner End
        shell: pwsh
        run: |
          $scannerPath = "$env:USERPROFILE\.dotnet\tools\dotnet-sonarscanner"
          & $scannerPath end /d:sonar.login="$env:SONAR_TOKEN"