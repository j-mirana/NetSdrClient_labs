name: SonarQube

on:
  push:
    branches:
      - lab1
  pull_request:
    branches:
      - lab1

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Remove sonar-project.properties (conflicts)
        shell: pwsh
        run: |
          Remove-Item -Path "sonar-project.properties" -Force -ErrorAction SilentlyContinue

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud Begin, Build, Test, End
        shell: pwsh
        run: |
          $scanner = "$env:USERPROFILE\.dotnet\tools\dotnet-sonarscanner"

          # === BEGIN ===
          & $scanner begin `
            /k:"j-mirana_NetSdrClient_labs" `
            /o:"j-mirana" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.login="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.xml"

          # === BUILD ===
          dotnet build NetSdrClient.sln -c Release

          # === TEST WITH COVERAGE ===
          dotnet test NetSdrClientAppTests/NetSdrClientAppTests.csproj -c Release `
            /p:CollectCoverage=true `
            /p:CoverletOutput=TestResults/coverage.xml `
            /p:CoverletOutputFormat=opencover

          # === END ===
          & $scanner end `
            /d:sonar.login="$env:SONAR_TOKEN"
