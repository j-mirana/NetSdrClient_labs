name: SonarQube

on:
  push:
    branches:
      - lab1
  pull_request:
    branches:
      - lab1

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      # ---------------------------
      # 1. Checkout the repository
      # ---------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------
      # 2. Install .NET 8
      # ---------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ---------------------------
      # 3. FULL CLEAN WORKSPACE
      # ---------------------------
      - name: Full Clean Workspace
        shell: pwsh
        run: |
          git clean -xfd
          dotnet clean NetSdrClient.sln

      # ---------------------------
      # 4. Remove sonar-project.properties
      # ---------------------------
      - name: Remove sonar-project.properties
        shell: pwsh
        run: |
          Remove-Item -Path "sonar-project.properties" -ErrorAction SilentlyContinue

      # ---------------------------
      # 5. Reinstall Sonar Scanner
      # ---------------------------
      - name: Reinstall Sonar Scanner
        shell: pwsh
        run: |
          dotnet tool uninstall --global dotnet-sonarscanner
          dotnet tool install --global dotnet-sonarscanner

      # ---------------------------
      # 6. Sonar Begin
      # ---------------------------
      - name: Sonar Begin
        shell: pwsh
        run: |
          $scanner = "$env:USERPROFILE\.dotnet\tools\dotnet-sonarscanner"
          & $scanner begin `
            /k:"j-mirana_NetSdrClient_labs" `
            /o:"j-mirana" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.login="${env:SONAR_TOKEN}" `
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.xml" `
            /d:sonar.exclusions="**/bin/**,**/obj/**"

      # ---------------------------
      # 7. RESTORE NUGET PACKAGES (CRITICAL FIX)
      # ---------------------------
      - name: Restore NuGet Packages
        shell: pwsh
        run: dotnet restore NetSdrClient.sln

      # ---------------------------
      # 8. Build Solution
      # ---------------------------
      - name: Build Solution
        shell: pwsh
        run: dotnet build NetSdrClient.sln -c Release --no-incremental

      # ---------------------------
      # 9. Run Tests + Coverage
      # ---------------------------
      - name: Run Tests with Coverage
        shell: pwsh
        run: |
          dotnet test NetSdrClientAppTests/NetSdrClientAppTests.csproj -c Release `
            /p:CollectCoverage=true `
            /p:CoverletOutput=TestResults/coverage.xml `
            /p:CoverletOutputFormat=opencover

      # ---------------------------
      # 10. Sonar End
      # ---------------------------
      - name: Sonar End
        shell: pwsh
        run: |
          $scanner = "$env:USERPROFILE\.dotnet\tools\dotnet-sonarscanner"
          & $scanner end /d:sonar.login="${env:SONAR_TOKEN}"