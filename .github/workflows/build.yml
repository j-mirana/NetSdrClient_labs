name: SonarCloud Analysis

on:
  push:
    branches:
      - lab1
  pull_request:
    branches:
      - lab1

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Remove sonar-project.properties if exists
        shell: pwsh
        run: |
          if (Test-Path "./sonar-project.properties") {
            Remove-Item "./sonar-project.properties" -Force
          }

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: |
          if (-not (Get-Command dotnet-sonarscanner -ErrorAction SilentlyContinue)) {
            dotnet tool install --global dotnet-sonarscanner
          }

      - name: Build and Analyze
        shell: pwsh
        run: |
          $scanner = "$env:USERPROFILE\.dotnet\tools\dotnet-sonarscanner"

          # Start analysis
          & $scanner begin `
            /k:"j-mirana_NetSdrClient_labs" `
            /o:"j-mirana" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.login=$env:SONAR_TOKEN

          # Build solution
          dotnet build NetSdrClient.sln --no-incremental

          # End analysis
          & $scanner end `
            /d:sonar.login=$env:SONAR_TOKEN
