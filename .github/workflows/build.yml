name: SonarQube
on:
  # 1. Тригер на push у гілку 'lab1'
  push:
    branches:
      - lab1
  
  # 2. Тригер на pull_request, що таргетує гілку 'lab1'
  pull_request:
    branches:
      - lab1
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
          
      # ВИПРАВЛЕННЯ: Використовуємо змінну середовища, а не передачу токена через аргумент /d:sonar.token=...
      # SonarScanner автоматично підхоплює SONAR_TOKEN, якщо він визначений в 'env'.
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Токен тепер доступний як змінна середовища
        shell: powershell
        run: |
          $scannerPath = "${{ runner.temp }}\scanner\dotnet-sonarscanner"
          
          # BEGIN STEP: Прибираємо /d:sonar.token, оскільки SonarScanner автоматично знайде його в ENV.
          # Це вирішує проблему з форматом.
          & $scannerPath begin `
            /k:"j-mirana_NetSdrClient_labs" `
            /o:"j-mirana" 
          
          # BUILD STEP
          dotnet build NetSdrClient.sln
          
          # END STEP: Прибираємо /d:sonar.token
          & $scannerPath end